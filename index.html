<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Online24 Pharmacy — Your trusted online pharmacy for medicines and healthcare products. Order medicines online with fast delivery." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10B981" />
    <title>Online24 Pharmacy</title>
    <script>
      // Theme bootstrap (runs before React to prevent flash)
      (function () {
        try {
          var stored = localStorage.getItem('theme'); // 'light' | 'dark' | 'system' | null
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = stored === 'dark' || stored === 'light'
            ? stored
            : (prefersDark ? 'dark' : 'light');

          var root = document.documentElement;
          root.classList.remove('dark');
          if (resolved === 'dark') root.classList.add('dark');
          root.style.colorScheme = resolved;
        } catch (e) {
          // no-op: fallback to CSS defaults
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
